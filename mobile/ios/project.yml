# Projeto Xcode gerado com XcodeGen (brew install xcodegen; xcodegen generate)
name: Wabotia
options:
  bundleIdPrefix: br.com.queven
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  developmentLanguage: pt-BR
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: A6AXA7CBU3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.17.0"
    CURRENT_PROJECT_VERSION: "5"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
targets:
  Wabotia:
    type: application
    platform: iOS
    # A pasta inteira entra como fonte; o XcodeGen separa código e recursos (Assets.xcassets e, quando
    # existir, Resources/GoogleService-Info.plist). O manifesto de privacidade é declarado à parte para
    # ir sempre para "Copy Bundle Resources", qualquer que seja a versão do XcodeGen.
    sources:
      - path: Wabotia
        excludes:
          - "Resources/PrivacyInfo.xcprivacy"
      - path: Wabotia/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Wabotia/Info.plist
      properties:
        CFBundleDisplayName: Wabotia
        CFBundleName: Wabotia
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSMicrophoneUsageDescription: "O microfone é usado para gravar mensagens de voz."
        NSCameraUsageDescription: "A câmera é usada para enviar fotos e vídeos ao cliente."
        NSPhotoLibraryUsageDescription: "A galeria é usada para escolher fotos e vídeos para enviar ao cliente."
        NSPhotoLibraryAddUsageDescription: "A galeria é usada para salvar fotos e vídeos recebidos quando você escolhe salvar."
        NSLocationWhenInUseUsageDescription: "A localização é usada apenas quando você escolhe compartilhá-la com o cliente."
        NSContactsUsageDescription: "Os contatos são usados apenas quando você escolhe compartilhar um cartão de contato ou salvar um contato recebido."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: br.com.queven.wabotia
            CFBundleURLSchemes: [wabotia]
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Wabotia/Wabotia.entitlements
      properties:
        # Um só arquivo de entitlements; o Xcode troca $(APS_ENVIRONMENT) ao assinar (ver settings.configs).
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.queven.wabotia
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-ObjC"]
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - sdk: AVFoundation.framework
  WabotiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WabotiaTests
    dependencies:
      - target: Wabotia
schemes:
  Wabotia:
    build:
      targets:
        Wabotia: all
        WabotiaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [WabotiaTests]
    archive:
      config: Release
