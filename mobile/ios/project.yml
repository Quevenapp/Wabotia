# Projeto Xcode gerado com XcodeGen (brew install xcodegen; xcodegen generate)
name: Wabotia
options:
  bundleIdPrefix: br.com.queven
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: A6AXA7CBU3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "125.0.0"
targets:
  Wabotia:
    type: application
    platform: iOS
    sources:
      - path: Wabotia
    resources:
      - path: Wabotia/Resources
    info:
      path: Wabotia/Info.plist
      properties:
        CFBundleDisplayName: Wabotia
        CFBundleName: Wabotia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification, audio]
        NSMicrophoneUsageDescription: "O microfone é usado para gravar mensagens de voz e para ligações de voz pelo WhatsApp."
        NSCameraUsageDescription: "A câmera é usada para enviar fotos e vídeos ao cliente."
        NSPhotoLibraryUsageDescription: "A galeria é usada para escolher fotos e vídeos para enviar ao cliente."
        NSLocationWhenInUseUsageDescription: "A localização é usada apenas quando você escolhe compartilhá-la com o cliente."
        NSContactsUsageDescription: "Os contatos são usados apenas quando você escolhe compartilhar um cartão de contato."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationQueriesSchemes: [https]
        CFBundleURLTypes:
          - CFBundleURLName: br.com.queven.wabotia
            CFBundleURLSchemes: [wabotia]
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Wabotia/Wabotia.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.queven.wabotia
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: ["-ObjC"]
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: WebRTC
        product: WebRTC
      - sdk: CallKit.framework
      - sdk: AVFoundation.framework
  WabotiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WabotiaTests
    dependencies:
      - target: Wabotia
schemes:
  Wabotia:
    build:
      targets:
        Wabotia: all
        WabotiaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [WabotiaTests]
    archive:
      config: Release
