# Projeto Xcode gerado com XcodeGen (brew install xcodegen; xcodegen generate)
name: Wabotia
options:
  bundleIdPrefix: br.com.queven
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  developmentLanguage: pt-BR
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: A6AXA7CBU3
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.18.0"
    CURRENT_PROJECT_VERSION: "6"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.6.0"
  # Impressão térmica do cupom do totem (modo aparelho), por caminho local: o kit fica na pasta vizinha do
  # repositório (D:\Code\ThermalPrinterKit no Dell). build-on-mac.ps1 reproduz o mesmo layout no Mac.
  ThermalPrinterKit:
    path: ../../../../ThermalPrinterKit/ios
targets:
  Wabotia:
    type: application
    platform: iOS
    # A pasta inteira entra como fonte; o XcodeGen separa código e recursos (Assets.xcassets e, quando
    # existir, Resources/GoogleService-Info.plist). O manifesto de privacidade é declarado à parte para
    # ir sempre para "Copy Bundle Resources", qualquer que seja a versão do XcodeGen.
    sources:
      - path: Wabotia
        excludes:
          - "Resources/PrivacyInfo.xcprivacy"
      - path: Wabotia/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Wabotia/Info.plist
      properties:
        CFBundleDisplayName: Wabotia
        CFBundleName: Wabotia
        CFBundleDevelopmentRegion: pt-BR
        CFBundleLocalizations: [pt-BR]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # O app de atendimento fica em retrato no iPhone (AppDelegate.supportedInterfaceOrientationsFor); a paisagem
        # declarada aqui só vale no modo aparelho (totem, painel de chamadas e híbrido). No iPad, todas as orientações.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [remote-notification]
        NSMicrophoneUsageDescription: "O microfone é usado para gravar mensagens de voz."
        NSCameraUsageDescription: "A câmera é usada para enviar fotos e vídeos ao cliente, fotografar o checklist da ordem de serviço."
        NSPhotoLibraryUsageDescription: "A galeria é usada para escolher fotos e vídeos para enviar ao cliente."
        NSPhotoLibraryAddUsageDescription: "A galeria é usada para salvar fotos e vídeos recebidos quando você escolhe salvar."
        NSLocationWhenInUseUsageDescription: "A localização é usada apenas quando você escolhe compartilhá-la com o cliente."
        NSContactsUsageDescription: "Os contatos são usados apenas quando você escolhe compartilhar um cartão de contato ou salvar um contato recebido."
        NSBluetoothAlwaysUsageDescription: "O Bluetooth é usado para imprimir o cupom da senha numa impressora térmica, quando este aparelho é um totem."
        NSLocalNetworkUsageDescription: "A rede local é usada para encontrar e usar a impressora térmica Wi-Fi que imprime o cupom da senha no totem."
        # Sem exceção do ATS: o app só fala com servidores https. A impressora Wi-Fi usa socket direto (Network), que
        # não passa pelo ATS; http:// para servidor local de desenvolvimento só no build de depuração.
        CFBundleURLTypes:
          - CFBundleURLName: br.com.queven.wabotia
            CFBundleURLSchemes: [wabotia]
        FirebaseAppDelegateProxyEnabled: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Wabotia/Wabotia.entitlements
      properties:
        # Um só arquivo de entitlements; o Xcode troca $(APS_ENVIRONMENT) ao assinar (ver settings.configs).
        aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.queven.wabotia
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        # iPhone e iPad: o iPad serve de totem e de painel de chamadas (modo aparelho).
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-ObjC"]
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
      - package: ThermalPrinterKit
        product: ThermalPrinterKit
      - package: ThermalPrinterKit
        product: Printher
      - sdk: AVFoundation.framework
  WabotiaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WabotiaTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Wabotia
schemes:
  Wabotia:
    build:
      targets:
        Wabotia: all
        WabotiaTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [WabotiaTests]
    archive:
      config: Release
